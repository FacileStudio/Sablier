# The Go family's coding standard, enforced by filet. `preset: facile` is the
# suite's shared configuration (limits, style, the router.go rule); this file
# adds only what Sablier needs on top.
# https://github.com/FacileStudio/filet
kind: app
preset: facile

gate:
  # gofmt -l . in apps/api walks the vendored modules, which upstream does not
  # gofmt. The check step's format rule already covers Sablier's own Go files
  # with vendor ignored. clippy and cargo test cannot build apps/desktop before
  # scripts/stage-ui.sh has built the client into its dist/ (generate_context!
  # embeds it); .github/workflows/desktop.yml runs cargo test after staging.
  disable: [gofmt, clippy, cargo]
