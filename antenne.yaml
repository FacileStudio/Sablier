# Documents the pool events Sablier uses. The API registers EmitEvents and
# ListenEvents from modules/antenne/service.go; a test fails on drift.
app: Sablier
events:
  emit:
    - project.created
    - project.updated
    - project.deleted
    - task.created
    - task.updated
    - task.deleted
    - time_entry.created
    - time_entry.updated
    - time_entry.deleted
  listen:
    - project.created
    - project.updated
    - project.deleted
    - task.created
    - task.updated
    - task.deleted
    - agent_session.created
    - agent_session.updated
