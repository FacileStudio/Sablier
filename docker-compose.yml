services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sablier}
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.sablier-web.rule: "Host(`sablier.facile.studio`)"
      traefik.http.routers.sablier-web.entrypoints: web
      traefik.http.routers.sablier-web.middlewares: redirect-to-https@file
      traefik.http.routers.sablier-web.service: sablier-svc
      traefik.http.routers.sablier-secure.rule: "Host(`sablier.facile.studio`)"
      traefik.http.routers.sablier-secure.entrypoints: websecure
      traefik.http.routers.sablier-secure.tls.certresolver: letsencrypt
      traefik.http.routers.sablier-secure.service: sablier-svc
      traefik.http.services.sablier-svc.loadbalancer.server.port: "4000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/sablier?sslmode=disable}
      PORT: ${PORT:-4000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_DIR: ${STORAGE_DIR:-/data}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DOMAINS: ${DOMAINS:-http://localhost:3000,http://127.0.0.1:3000}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      OIDC_CLAIMS_SCOPE: ${OIDC_CLAIMS_SCOPE:-}
      SSO_ONLY: ${SSO_ONLY:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
      # Antenne. These only seed the connection on a database with no
      # app_settings row yet — once the row exists, the value stored there wins
      # and is edited from Sablier's own settings page.
      ANTENNE_URL: ${ANTENNE_URL:-}
      ANTENNE_SECRET: ${ANTENNE_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api_data:/data

networks:
  dokploy-network:
    external: true

volumes:
  db_data:
    name: sablier_db_data
  api_data:
    name: sablier_api_data
