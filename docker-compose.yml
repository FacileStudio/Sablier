services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sablier}
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
      - "4000"
    networks:
      - default
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.sablier-api-web.rule: "Host(`sablier.facile.studio`) && PathPrefix(`/api`)"
      traefik.http.routers.sablier-api-web.entrypoints: web
      traefik.http.routers.sablier-api-web.middlewares: redirect-to-https@file
      traefik.http.routers.sablier-api-web.service: sablier-api-svc
      traefik.http.routers.sablier-api-secure.rule: "Host(`sablier.facile.studio`) && PathPrefix(`/api`)"
      traefik.http.routers.sablier-api-secure.entrypoints: websecure
      traefik.http.routers.sablier-api-secure.tls.certresolver: letsencrypt
      traefik.http.routers.sablier-api-secure.service: sablier-api-svc
      traefik.http.services.sablier-api-svc.loadbalancer.server.port: "4000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/sablier?sslmode=disable}
      PORT: ${PORT:-4000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_DIR: ${STORAGE_DIR:-/data}
      DOMAINS: ${DOMAINS:-http://localhost:3000,http://127.0.0.1:3000}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      SSO_ONLY: ${SSO_ONLY:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api_data:/data

  client:
    restart: unless-stopped
    build:
      context: apps/client
      dockerfile: Dockerfile
    expose:
      - "80"
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - api

networks:
  dokploy-network:
    external: true

volumes:
  db_data:
    name: sablier_db_data
  api_data:
    name: sablier_api_data
