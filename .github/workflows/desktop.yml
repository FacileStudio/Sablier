name: desktop

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            runner: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin --bundles app,dmg
            bundle_dir: apps/desktop/target/universal-apple-darwin/release/bundle
          - name: linux-x64
            runner: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            tauri_args: --bundles deb,rpm
            bundle_dir: apps/desktop/target/release/bundle
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: App and tag versions agree
        if: github.ref_type == 'tag'
        run: |
          app=$(python3 -c "import json;print(json.load(open('apps/desktop/tauri.conf.json'))['version'])")
          echo "app=$app tag=$GITHUB_REF_NAME"
          test "desktop-v$app" = "$GITHUB_REF_NAME"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> target

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf libssl-dev

      - name: Test
        working-directory: apps/desktop
        run: cargo test --locked

      - name: Build the app
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.tauri_args }}

      - name: Name the installers
        run: |
          mkdir -p out
          bundle="${{ matrix.bundle_dir }}"
          case "${{ matrix.name }}" in
            macos-universal)
              cp "$bundle"/dmg/*.dmg out/Sablier-macos-universal.dmg
              cp "$bundle"/macos/*.app.tar.gz out/Sablier-macos-universal.app.tar.gz
              cp "$bundle"/macos/*.app.tar.gz.sig out/Sablier-macos-universal.app.tar.gz.sig ;;
            linux-x64)
              cp "$bundle"/deb/*.deb out/Sablier-linux-x64.deb
              cp "$bundle"/deb/*.deb.sig out/Sablier-linux-x64.deb.sig
              cp "$bundle"/rpm/*.rpm out/Sablier-linux-x64.rpm
              cp "$bundle"/rpm/*.rpm.sig out/Sablier-linux-x64.rpm.sig ;;
          esac
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: out/*
          retention-days: 7

  android:
    name: android-universal
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        run: |
          missing=0
          for v in KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::secret for $v is empty"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sablier.keystore"
          test -s "$RUNNER_TEMP/sablier.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sablier.keystore" >> "$GITHUB_ENV"

      - name: Compute version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#desktop-v}"
          else
            version=$(python3 -c "import json;print(json.load(open('apps/desktop/tauri.conf.json'))['version'])")
          fi
          core="${version%%[-+]*}"
          major="$(echo "$core" | cut -d. -f1)"
          minor="$(echo "$core" | cut -d. -f2)"
          patch="$(echo "$core" | cut -d. -f3)"
          code=$((major * 1000000 + minor * 1000 + patch))
          echo "SABLIER_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "SABLIER_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "version $version, code $code"

      - name: Build the web app
        working-directory: apps/client
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build
          bunx cap sync android

      - name: Build the APK
        working-directory: apps/client/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify and name the APK
        run: |
          apk=apps/client/android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          apksigner="$(find "$ANDROID_HOME"/build-tools -maxdepth 2 -name apksigner | sort -V | tail -n1)"
          "$apksigner" verify --print-certs "$apk"
          count="$(find apps/client/android/app/build/outputs/apk/release -name '*.apk' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected one universal APK, found $count"
            exit 1
          fi
          mkdir -p out
          cp "$apk" out/Sablier-android-universal.apk
          (cd out && sha256sum Sablier-android-universal.apk > Sablier-android-universal.apk.sha256)
          cat out/Sablier-android-universal.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: android-universal
          path: out/*
          retention-days: 7

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/sablier.keystore"

  publish:
    name: publish the release
    needs: [bundle, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Test the manifest builder
        run: bun test apps/desktop/scripts

      - name: Build latest.json
        run: |
          bun run apps/desktop/scripts/latest-json.ts \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir out \
            --changelog apps/desktop/CHANGELOG.md \
            --out out/latest.json
          cat out/latest.json

      - name: Create the release with installers, the APK, signatures, checksums and latest.json
        run: |
          cd out
          test -f Sablier-android-universal.apk
          test -f Sablier-android-universal.apk.sha256
          sha256sum Sablier-*.dmg Sablier-*.deb Sablier-*.rpm > desktop-checksums.txt
          cat desktop-checksums.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Sablier desktop ${GITHUB_REF_NAME#desktop-v}" \
            --notes "Tray app for Sablier, see docs/automatic-time-tracking.md. The macOS build is not notarized yet: right-click the app and choose Open the first time. Sablier-android-universal.apk is the Android app." \
            --latest \
            Sablier-* desktop-checksums.txt latest.json
