[package]
name = "sablier-desktop"
version = "0.2.0"
description = "Sablier desktop app: a tray timer with idle detection and local window rules"
license = "MIT"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "sablier-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dirs = "6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
kdotool = { version = "0.2.3", default-features = false }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
x11rb = { version = "0.13", features = ["screensaver"] }
zbus = "5"

[target.'cfg(not(target_os = "linux"))'.dependencies]
active-win-pos-rs = "0.11"
user-idle = { version = "0.6", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
