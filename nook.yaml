# Documents the pool events Sablier uses. The API builds its pool config
# inline (modules/nookpool/service.go) — keep this file in sync with it.
app: Sablier
events:
  emit:
    - project.created
    - project.updated
    - project.deleted
    - task.created
    - task.updated
    - task.deleted
    - time_entry.created
    - time_entry.updated
  listen:
    - project.created
    - project.updated
    - project.deleted
    - task.created
    - task.updated
    - task.deleted
    - agent_session.created
    - agent_session.updated
